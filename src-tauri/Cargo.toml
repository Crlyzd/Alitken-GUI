[package]
name = "alitken-gui"
version = "0.7.1"
description = "Alitken Media Converter & Video Splitter (Tauri v2 Desktop UI)"
authors = ["Alitken"]
edition = "2021"

[features]
default = []
store-build = []

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "2.1"
sevenz-rust = "0.6"
dirs = "5.0"
walkdir = "2.5"
regex = "1.10"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell"
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D11"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = false

